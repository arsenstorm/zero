[package]
name = "zero-drop"
version = "0.1.0"
edition = "2021"
description = "Zero's file-drop client: the zero CLI contract over a shared folder"

[[bin]]
name = "zero-drop"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

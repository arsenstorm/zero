version: 2
updates:
  # Every ecosystem waits a week after an upstream release before proposing it: a compromised release is usually found
  # and pulled within days.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]

  # dmgbuild, which makes the disk image (apps/macos/dmg/requirements.txt, pinned with hashes).
  - package-ecosystem: pip
    directory: /apps/macos/dmg
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dmgbuild:
        patterns: ["*"]

  # No swift ecosystem: the Swift package has no dependencies.

  # The bun ecosystem updates bun.lock with package.json (the npm one doesn't, failing `bun install --frozen-lockfile`).
  - package-ecosystem: bun
    directories: ["/", "/site"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
      tooling:
        patterns: ["@biomejs/*", "ultracite"]

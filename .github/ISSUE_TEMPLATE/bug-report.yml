name: Bug report
description: Something in Zero is broken, regressed, or doesn't do what the docs say.
title: "[bug]: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For a security issue, **don't open an issue**: follow SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences.
      placeholder: "When I do X, I expect Y, but Z happens."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Zero version
      description: Settings shows it ("Zero 0.4.0"), or give the commit you built.
      placeholder: "0.4.0 or abc1234"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Mac app (window, control bar, inbox, Settings)
        - Daemon (zerod) and agent sessions
        - The zero CLI or the Claude Code plugin
        - Codex, Claude Code or OpenCode integration
        - Terminals
        - iPhone app or the relay
        - Browser extension
        - Website or docs
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Not agent-specific
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a task with ...
        2. ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Screenshots or logs help. Remove tokens, keys and anything private first.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, Mac model, and the agent CLIs' versions (claude --version, codex --version, opencode --version).
      render: text

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues and this isn't one of them.
          required: true
        - label: This isn't a security vulnerability.
          required: true

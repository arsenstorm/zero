name: Feature request
description: Something Zero should do, or do differently.
title: "[feat]: "
labels: ["enhancement", "triage"]

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: The problem
      description: What are you trying to do, and how do you do it today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it would work for you. A sketch or screenshot helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Mac app (window, control bar, inbox, Settings)
        - Daemon (zerod) and agent sessions
        - The zero CLI or the Claude Code plugin
        - Codex, Claude Code or OpenCode integration
        - Terminals
        - iPhone app or the relay
        - Browser extension
        - Website or docs
        - Across Zero / not sure
    validations:
      required: true

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Before you send it
      options:
        - label: I searched the existing issues and this isn't one of them.
          required: true

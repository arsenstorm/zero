# Deploys Zero's hosted relay (apps/relay) to relay.withzero.dev when it changes on main.
# Needs the CLOUDFLARE_API_TOKEN secret: a Cloudflare API token that can edit Workers on the withzero.dev account.
name: Deploy relay

on:
  push:
    branches: [main]
    paths: ["apps/relay/**", ".github/workflows/deploy-relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test
        run: node --test apps/relay/relay.test.js
      - name: Deploy
        working-directory: apps/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx -y wrangler@4 deploy

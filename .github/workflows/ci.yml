name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  zerod:
    name: zerod (Rust)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p zerod --all-targets -- -D warnings

      - name: Test
        run: cargo test -p zerod

  swift:
    name: Apps (Swift)
    # Needs Ghostty's engine built on macOS, whose minutes are costly on a private repository: public only.
    if: github.event.repository.visibility == 'public'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)" && swift --version

      - name: Format
        run: swift format lint --strict --recursive --parallel apps/macos/Package.swift apps/macos/Sources apps/macos/Tests apps/macos/scripts apps/ios

      - name: Ghostty engine
        uses: ./.github/actions/ghostty

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # ZeroCore's tests talk to a real zerod, at target/debug/zerod.
      - name: Build zerod
        run: cargo build -p zerod

      - name: Build
        run: swift build --package-path apps/macos

      - name: Test
        run: swift test --package-path apps/macos

  site:
    name: Site, relay and extension (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install the formatter
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Install the site
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build the site
        working-directory: site
        run: bun run build

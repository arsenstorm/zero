# Zero's releases (docs/releasing.md). A pushed tag vX.Y.Z builds what `make bundle` builds, signs it as a Developer ID
# with the hardened runtime, notarises and staples it, then publishes the GitHub release Zero's updater offers: Zero.zip,
# its SHA-256, a Sigstore signature and SLSA build provenance. Run by hand, it rehearses everything up to publishing and
# leaves the notarised zip as the run's artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign and notarise
    runs-on: macos-26
    timeout-minutes: 90
    # The Apple secrets live in this environment, which only main and v* tags may use.
    environment: signing
    permissions:
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The updater compares the tag with the running build's CFBundleShortVersionString, so they must agree.
      - name: Check the tag is the version in Info.plist
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' apps/macos/Resources/Info.plist)
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG isn't v$version, the version in Info.plist (vX.Y.Z)"
            exit 1
          fi

      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)" && swift --version

      - name: Ghostty engine
        uses: ./.github/actions/ghostty

      # No Cargo cache here: a release builds from scratch.
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          rustup default stable

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$CERTIFICATE" > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -m1 '"Developer ID Application' | grep -o '[0-9A-F]\{40\}' || true)
          if [ -z "$identity" ]; then
            echo "::error::DEVELOPER_ID_CERTIFICATE holds no Developer ID Application identity"
            exit 1
          fi
          echo "SIGN=$identity" >> "$GITHUB_ENV"

      - name: Build and sign
        run: make bundle SIGNFLAGS=--timestamp

      - name: Check the signatures
        run: |
          codesign --verify --deep --strict --verbose=2 build/Zero.app
          for binary in build/Zero.app/Contents/MacOS/* build/Zero.app/Contents/Resources/zero-drop-darwin-arm64 build/Zero.app; do
            codesign -d --verbose=2 "$binary" 2>&1 | grep -q 'flags=0x10000(runtime)' || { echo "::error::$binary lacks the hardened runtime"; exit 1; }
            codesign -d --verbose=2 "$binary" 2>&1 | grep -q '^Timestamp=' || { echo "::error::$binary lacks a secure timestamp"; exit 1; }
          done

      - name: Notarise and staple
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          base64 --decode <<<"$API_KEY" > "$key"
          auth=(--key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          ditto -c -k --keepParent build/Zero.app "$RUNNER_TEMP/notarise.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" "${auth[@]}" --wait --timeout 1h --output-format json || true)
          status=$(jq -r '.status // empty' <<<"$result" 2>/dev/null || true)
          if [ "$status" != Accepted ]; then
            echo "::error::Notarisation ended as '${status:-no result}'"
            id=$(jq -r '.id // empty' <<<"$result" 2>/dev/null || true)
            [ -z "$id" ] || xcrun notarytool log "$id" "${auth[@]}"
            exit 1
          fi
          xcrun stapler staple build/Zero.app
          xcrun stapler validate build/Zero.app
          spctl --assess --type execute -vv build/Zero.app

      - name: Zip
        working-directory: build
        run: |
          ditto -c -k --keepParent Zero.app Zero.zip
          shasum -a 256 Zero.zip > Zero.zip.sha256
          cat Zero.zip.sha256

      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Zero
          path: |
            build/Zero.zip
            build/Zero.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove the keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # the release
      id-token: write # Sigstore's keyless signing, for the signature and the provenance
      attestations: write # the provenance, in the repository's attestations
    steps:
      # GoReleaser reads the tags to find the previous release for the notes.
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Zero
          path: ${{ runner.temp }}/release

      - name: Set up cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the zip
        working-directory: ${{ runner.temp }}/release
        run: cosign sign-blob --yes --bundle Zero.zip.sigstore.json Zero.zip

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/Zero.zip

      # Attached too: Scorecard's Signed-Releases check looks for a release asset ending in .intoto.jsonl.
      - name: Keep the provenance with the release
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: jq -c . "$BUNDLE" > "$RUNNER_TEMP/release/Zero.zip.intoto.jsonl"

      - name: Publish the release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean --config .github/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASSETS: ${{ runner.temp }}/release

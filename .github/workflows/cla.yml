# The Contributor License Agreement (CLA.md): a pull request from someone who hasn't signed it is asked to, once, by a
# comment; signatures are kept on the cla-signatures branch. The maintainer and bots aren't asked.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# Nothing by default; the one job asks for what the CLA action needs (Scorecard: write access at the top is excessive).
permissions: {}

jobs:
  cla:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      # Pinned to its v2.6.1 commit: it runs on pull_request_target, with write access, so never a tag that can move.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/arsenstorm/zero/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: arsenstorm,arsenstorm2,dependabot[bot],github-actions[bot],*[bot]
          lock-pullrequest-aftermerge: false

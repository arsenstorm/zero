[package]
name = "zerod"
version = "0.1.0"
edition = "2024"
description = "Zero's daemon: runs agent sessions and keeps them, whether or not the app is open"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "io-std", "sync", "time", "fs", "signal"] }

[dev-dependencies]
# Paused time, so stall timers measured in minutes run in milliseconds.
tokio = { version = "1", features = ["test-util"] }
